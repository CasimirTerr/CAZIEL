name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Types
        run: mypy caziel
      - name: Generated files are up to date
        run: |
          python scripts/gen_checks_doc.py --check
          python scripts/gen_traffic.py --check
          python scripts/build_site_data.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95
      - name: The example fleet is flagged
        run: |
          set +e
          caziel scan examples/harbor-fleet --fail-on critical
          test $? -eq 2
      - name: The hardened fleet passes
        run: caziel scan examples/harbor-fleet-hardened --fail-on critical
      - name: Markdown report
        if: matrix.python-version == '3.13'
        run: caziel scan examples/harbor-fleet -f md -o caziel-report.md
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: caziel-report
          path: caziel-report.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Website renders the engine's numbers
        run: npm test
