# Harbor Logistics, Tempe distribution center.
# A fictional fleet used as Caziel's reference example. Account IDs and ARNs are made up.
name: Harbor Logistics - Tempe DC
account_id: "111122223333"
region: us-west-2

robots:
  - model: kx1
    thing_group: kx1-fleet
    things: {prefix: kx1-, count: 12}

iot:
  jobs:
    enabled: true
    handler: shell          # the robot's job agent runs the job document's commands
  greengrass:
    enabled: true

site:
  people_present: true      # pickers share aisles with the robots
  body_regions: [hand, forearm, upper_arm, chest, abdomen, thigh]

identities: cloud/iam.json
agents: cloud/agents.yaml
