[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caziel-robotics-security"
version = "1.0.0"
description = "Cloud-to-physical blast radius for AI-controlled robot fleets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Casimir Terrence" }]
keywords = ["robotics", "ros2", "aws-iot", "bedrock", "agentcore", "ai-security", "physical-ai", "iso-ts-15066"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.8", "types-PyYAML"]

[project.scripts]
caziel = "caziel.cli:main"

[project.urls]
Homepage = "https://casimirterr.github.io/CAZIEL/"
Source = "https://github.com/CasimirTerr/CAZIEL"
Checks = "https://github.com/CasimirTerr/CAZIEL/blob/main/CHECKS.md"

[tool.setuptools]
packages = ["caziel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["caziel"]
omit = ["caziel/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP007", "UP045", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"caziel/rules.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
